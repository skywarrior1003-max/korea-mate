name = "korea-mate"
pages_build_output_dir = "out"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# My Trip AI 글쓰기의 Gemini 호출을 서울 placement Worker 로 위임한다.
# 이유: Pages Functions 는 region placement 미지원이라 HKG ingress 시 Gemini 가
# 지역 차단된다. canary 실측: ingress HKG/NRT/KIX 무관 Worker 실행 colo=ICN, live 12/12.
[[services]]
binding = "AI_WRITING"
service = "gokoreamate-ai-writing"
# Preview 배포(브랜치 배포)는 Production 과 공유하는 Worker 대신 Preview 전용 Worker 를 부른다.
# (최상위 설정 = Production. 여기 없는 연결은 Preview 에 상속되지 않는다 — Pages 규칙)
[env.preview]
[[env.preview.services]]
binding = "AI_WRITING"
service = "gokoreamate-ai-writing-preview"
