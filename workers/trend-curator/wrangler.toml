# gokoreamate-trend-curator-staging — 주간 Trend 후보 자동 수집 (V3 §6)
#
# ⚠ Staging 전용. Production route/binding 0. 무료 플랜 범위(Cron Triggers 포함).
#   연결 대상은 Staging Supabase 뿐이다. 삭제: `wrangler delete` 또는
#   Dashboard → Workers → gokoreamate-trend-curator-staging → Delete.
#
# ⚠ §I key 분리: 현재 Staging 은 앱 공용 GEMINI_API_KEY 를 사용한다(한계 보고됨).
#   Production 연결 전 전용 TREND_GEMINI_API_KEY 를 발급·등록하고
#   CURATOR_REQUIRE_DEDICATED_KEY=1 로 공용 fallback 을 차단한다(fail-closed).
#
# secrets (wrangler secret put):
#   TREND_GEMINI_API_KEY         — (권장) curator 전용 Gemini key
#   GEMINI_API_KEY               — 임시 공용 key(Staging 한정 — Production 금지)
#   TREND_SUPABASE_URL           — Staging https://<ref>.supabase.co
#   TREND_SUPABASE_SERVICE_KEY   — Staging service_role
#   CURATOR_TRIGGER_SECRET       — 수동 trigger 인증(공개 trigger 금지)
#
# §H 게이트 vars(비밀 아님): SEARCH_ENABLED 미설정=provider 0(fail-closed),
#   ALLOWED_MODEL/BILLING_UNIT 이 코드 계약과 다르면 provider 0(가격 모델 변경 방어),
#   WEEKLY cap 은 4를 넘을 수 없다. 주간 하드캡의 원장은 DB(067 slots)다.

name = "gokoreamate-trend-curator-staging"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# UTC 월 19:00 = KST 화요일 04:00 (트래픽 최저 시간대)
[triggers]
crons = ["0 19 * * 1"]

# Gemini 지역 차단(HKG 등) 회피 — ai-writing 과 동일한 서울 리전 고정
[placement]
region = "gcp:asia-northeast3"


[vars]
CURATOR_SEARCH_ENABLED = "1"
CURATOR_WEEKLY_GROUNDED_PROMPT_CAP = "4"
CURATOR_ALLOWED_MODEL = "gemini-2.5-flash"
CURATOR_BILLING_UNIT = "grounded_prompt"
