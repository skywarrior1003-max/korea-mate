name = "gokoreamate-ai-writing"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# canary 기간 한정 노출(모든 요청은 x-internal-auth 이중 잠금).
# Service Binding 연결이 확정되면 false 로 전환한다.
workers_dev = true

# 이 Worker 의 존재 이유: Pages Functions 는 region placement 를 지원하지 않아
# 한국 사용자의 ingress colo 가 HKG 로 잡히면 Gemini 가 지역 차단(400)된다.
# 서울 GCP 리전(asia-northeast3) 최저 latency 지점에서 실행되도록 고정한다.
[placement]
region = "gcp:asia-northeast3"

# CORRECTION-V1 §9 — Worker 자체 kill switch. 'live' 를 명시하지 않는 한
# provider 호출 금지(코드가 누락도 off 로 처리하지만, 상태를 명시해 둔다).
[vars]
AI_WRITING_WORKER_MODE = "off"

# Preview 전용 Worker(`wrangler deploy --env preview` → gokoreamate-ai-writing-preview).
# Production Worker·키·스위치와 완전히 분리한다: Preview Pages 는 wrangler.toml 의
# [env.preview] 서비스 연결로 이 Worker 만 부른다. 비밀값(GEMINI_API_KEY = Preview 전용
# Google 키, INTERNAL_KEY = Preview Pages 의 INTERNAL_KEY 와 같은 값)은 이 Worker 에만
# secret 으로 넣는다. 비용 상한·기능 스위치는 호출측(Pages Functions)의 Staging DB
# 원장(ai_ops_*·ai_user_*)이 먼저 막는다 — 이 Worker 의 live 는 그 뒤의 전달 스위치다.
[env.preview]
name = "gokoreamate-ai-writing-preview"
workers_dev = false

[env.preview.placement]
region = "gcp:asia-northeast3"

[env.preview.vars]
AI_WRITING_WORKER_MODE = "live"
WORKER_ENV = "preview"
# Preview 전용 Google 프로젝트는 새 사용자라 gemini-2.5-flash 생성이 거절된다(404, 2026-09-30).
# 단가가 같은 3.5 Flash-Lite 로 Preview 만 시험한다. Production(최상위)은 설정하지 않는다 — writing-core MODEL 그대로.
GEMINI_MODEL = "gemini-3.5-flash-lite"
