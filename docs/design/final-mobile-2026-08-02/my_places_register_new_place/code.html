<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Entry | Luminous Voyage</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .glass-overlay {
            backdrop-filter: blur(12px);
            background: rgba(250, 250, 250, 0.8);
        }
        input:focus, textarea:focus {
            outline: none;
            border-bottom-color: #003d9b !important;
        }
        .chip-active {
            background-color: #6ef3f3 !important;
            color: #00201a !important;
            border-color: #6ef3f3 !important;
        }
        .scrapbook-frame {
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.08);
        }
        /* Custom scrollbar for mobile feel */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        body {
            background-color: #FAFAFA;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#003d9b",
                        "secondary": "#6ef3f3",
                        "on-background": "#1A1A1A",
                        "surface": "#FAFAFA",
                        "outline-variant": "#E0E0E0",
                        "on-surface-variant": "#757575"
                    },
                    "borderRadius": {
                        "DEFAULT": "0px",
                        "lg": "8px",
                        "xl": "12px",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-md": "20px",
                        "stack-lg": "40px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter", "sans-serif"],
                        "headline-lg": ["Inter", "sans-serif"],
                        "title-md": ["Inter", "sans-serif"],
                        "label-sm": ["JetBrains Mono", "monospace"]
                    }
                },
            },
        }
    </script>
</head>
<body class="text-on-background font-body-md overflow-x-hidden min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#FAFAFA]/90 backdrop-blur-md border-b border-black/[0.03] flex justify-between items-center px-container-padding h-16">
<button class="active:scale-95 transition-transform text-on-surface-variant">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-semibold text-lg tracking-tight">Register New Place</h1>
<div class="w-6"></div>
</header>
<main class="pt-24 pb-20 px-container-padding max-w-[420px] mx-auto space-y-stack-lg">
<!-- Section: Photo Capture -->
<section class="space-y-4">
<label class="text-[11px] uppercase tracking-[0.2em] font-semibold text-on-surface-variant/60 px-0.5 block">PLACE PHOTO (OPTIONAL)</label>
<div class="scrapbook-frame relative w-full aspect-[4/5] bg-white border border-black/[0.05] flex flex-col items-center justify-center overflow-hidden active:scale-[0.99] transition-all cursor-pointer">
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center opacity-10" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCL8YbR0pR5HI9juJLqzkPK0CbCDiDrs9loYqOOeZdqZDWRdqVmyta6fGIlqHrIhwOYwbwl_JZsYHj5awAjXOdGPHiCi24T3LmMQbB1iZOWks2ezp-Hsf4XusF2oRacQhprblUPLuEcHD0d4PbsvTZQFAVs9w6wDcMb9EtXYdZh-eD5qbPamw_1BZFBL_rXHWqu62C9i_RG1dhhU5dGr2Hv4EBn6DPUTeD8yY5DyDofyYCbYg6ovWA')"></div>
</div>
<div class="z-10 flex flex-col items-center gap-4">
<div class="w-16 h-16 rounded-full border border-black/10 flex items-center justify-center bg-white">
<span class="material-symbols-outlined text-black text-2xl">add_a_photo</span>
</div>
<span class="text-on-surface-variant font-medium text-sm">Upload or take a photo</span>
</div>
</div>
</section>
<!-- Section: Place Name -->
<section class="space-y-2">
<label class="text-[11px] uppercase tracking-[0.2em] font-semibold text-on-surface-variant/60 px-0.5 block" for="place-name">The location</label>
<input class="w-full h-14 px-0.5 bg-transparent border-0 border-b border-black/[0.08] focus:ring-0 focus:border-primary transition-all font-medium text-xl text-on-surface placeholder:text-on-surface-variant/30" id="place-name" placeholder="Place Name" type="text"/>
</section>
<!-- Section: Location & Map -->
<section class="space-y-4">
<label class="text-[11px] uppercase tracking-[0.2em] font-semibold text-on-surface-variant/60 px-0.5 block">Found at</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-on-surface-variant text-xl">location_on</span>
<input class="w-full h-10 pl-8 bg-transparent border-0 border-b border-black/[0.08] focus:ring-0 focus:border-primary transition-all text-sm text-on-surface placeholder:text-on-surface-variant/30" placeholder="Search for an address" type="text"/>
</div>
<div class="mt-2 rounded-lg overflow-hidden border border-black/[0.05] relative group">
<img class="w-full h-40 object-cover grayscale-[20%] opacity-90 group-hover:opacity-100 transition-opacity" data-alt="Satellite map view" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAEOS8VTHuq5pOmAGz2thWELsmTp2Xl2noDB1Nvr1Fd0SsEV54mujPuKhd2Cnv3QOd77U8cl7nBDm3-_taRxJlvgtsQ7TeK-quJaaKe2OXfHlbxf7_QRhKKza7DjjPs7zVl-v4Ai7vbilH_TITk8QFeqVX1kkLLb1xWSBuk-otVxYkNnQXVVhisRe3nywXtrc1Jd1ndCenWw6fLaZjogoZzaoUgvVvvCuw32WbnbBMM2xLY2quAgtw"/>
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-12 h-12 rounded-full bg-white/40 backdrop-blur-sm border border-white/60 flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-primary shadow-lg shadow-primary/40"></div>
</div>
</div>
<div class="absolute bottom-4 right-4">
<button class="bg-white px-5 py-2 rounded-full text-[10px] tracking-widest font-bold border border-black/10 shadow-sm active:scale-95 transition-all">
                    EDIT MAP
                </button>
</div>
</div>
</section>
<!-- Section: Category Chips -->
<section class="space-y-4">
<label class="text-[11px] uppercase tracking-[0.2em] font-semibold text-on-surface-variant/60 px-0.5 block">Category</label>
<div class="flex flex-wrap gap-2 pt-1">
<button class="px-5 py-2.5 rounded-full border border-black/[0.08] text-on-surface-variant text-[13px] font-medium transition-all hover:bg-black/[0.02]" onclick="toggleChip(this)">
                Food &amp; Drink
            </button>
<button class="px-5 py-2.5 rounded-full border border-black/[0.08] text-on-surface-variant text-[13px] font-medium transition-all chip-active" onclick="toggleChip(this)">
                Nature
            </button>
<button class="px-5 py-2.5 rounded-full border border-black/[0.08] text-on-surface-variant text-[13px] font-medium transition-all hover:bg-black/[0.02]" onclick="toggleChip(this)">
                Culture
            </button>
<button class="px-5 py-2.5 rounded-full border border-black/[0.08] text-on-surface-variant text-[13px] font-medium transition-all hover:bg-black/[0.02]" onclick="toggleChip(this)">
                Shop
            </button>
<button class="px-5 py-2.5 rounded-full border border-black/[0.08] text-on-surface-variant text-[13px] font-medium transition-all hover:bg-black/[0.02]" onclick="toggleChip(this)">
                Stay
            </button>
</div>
</section>
<!-- Section: Memo -->
<section class="space-y-4">
<div class="flex justify-between items-center px-0.5">
<label class="text-[11px] uppercase tracking-[0.2em] font-semibold text-on-surface-variant/60 block" for="memo">Personal Memo</label>
<span class="text-on-surface-variant/30 text-[9px] font-medium tracking-[0.2em]">0 / 500</span>
</div>
<textarea class="w-full p-0 bg-transparent border-0 border-b border-black/[0.08] focus:ring-0 focus:border-primary transition-all text-base text-on-surface placeholder:text-on-surface-variant/30 resize-none leading-relaxed min-h-[120px]" id="memo" placeholder="Add your own tips or reminders for this place..."></textarea>
</section>
<!-- Action Buttons -->
<div class="pt-8 pb-12 space-y-6">
<button class="w-full h-16 bg-primary text-white rounded-lg font-bold text-base tracking-wide shadow-xl shadow-primary/20 active:scale-[0.98] transition-all">Save Place</button>
<button class="w-full text-center text-on-surface-variant/40 hover:text-on-surface-variant text-[12px] font-semibold tracking-widest uppercase transition-all">
            Discard entry
        </button>
</div>
</main>
<script>
    function toggleChip(el) {
        el.classList.toggle('chip-active');
    }

    // Micro-interaction for input labels
    const inputs = document.querySelectorAll('input, textarea');
    inputs.forEach(input => {
        input.addEventListener('focus', () => {
            const label = input.parentElement.closest('section').querySelector('label');
            if (label) label.classList.add('text-primary');
            if (label) label.classList.remove('text-on-surface-variant/60');
        });
        input.addEventListener('blur', () => {
            const label = input.parentElement.closest('section').querySelector('label');
            if (label) label.classList.remove('text-primary');
            if (label) label.classList.add('text-on-surface-variant/60');
        });
    });
</script>
</body></html>
